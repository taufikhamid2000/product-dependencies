<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product dependencies</title>
<meta name="description" content="Which products and shared APIs each product uses.">
<style>
:root {
  --bg: #f6f6f9;
  --surface: #ffffff;
  --text: #1c1b2e;
  --muted: #5d5b73;
  --line: #e2e1ec;
  --accent: #4b3fc9;
  --accent-ink: #ffffff;
  --accent-soft: #ecebfb;
  --prod: #0d7a5f;
  --prod-soft: #e1f4ee;
  --key: #b3441f;
  --key-soft: #fbece6;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121120;
    --surface: #1b1a2d;
    --text: #ececf6;
    --muted: #a3a1bd;
    --line: #2f2e47;
    --accent: #8f86ff;
    --accent-ink: #14122b;
    --accent-soft: #28254d;
    --prod: #4fd1a5;
    --prod-soft: #12302a;
    --key: #f2a07f;
    --key-soft: #3a211a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 920px; margin: 0 auto; padding: 32px 16px 48px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.01em; }
.lede { margin: 0 0 24px; color: var(--muted); }
h2 {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin: 28px 0 10px; font-weight: 650;
}
.label { font-size: 0.85rem; font-weight: 600; margin: 0 0 8px; color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 0.88rem/1 inherit; font-family: inherit;
  padding: 10px 14px; min-height: 40px;
  border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); cursor: pointer;
  transition: background .15s, border-color .15s;
}
.chip:hover { border-color: var(--accent); }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip svg { width: 14px; height: 14px; flex: none; }

.summary {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--accent); border-radius: var(--radius);
  padding: 14px 16px; margin: 0 0 8px; font-weight: 550;
}
.summary .auth { display: block; margin-top: 2px; font-weight: 400; color: var(--muted); font-size: 0.92rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
  transition: opacity .2s, border-color .2s, transform .2s;
}
.card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card.dim { opacity: .38; }
.card.product.on { border-color: var(--prod); box-shadow: 0 0 0 1px var(--prod) inset; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-name { font-weight: 650; font-size: 1.02rem; }
.kind { font-size: 0.8rem; color: var(--muted); margin: 0 0 10px; }
.card.product .kind { color: var(--prod); }
.key {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 8px; background: var(--key-soft); color: var(--key);
}
.key svg { width: 16px; height: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 0.78rem; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
}
.card.product .tag { background: var(--prod-soft); color: var(--prod); }

.legend {
  display: flex; align-items: flex-start; gap: 10px;
  margin-top: 28px; padding: 12px 14px; border-radius: var(--radius);
  background: var(--key-soft); color: var(--text); font-size: 0.9rem;
}
.legend .key { background: transparent; flex: none; width: 22px; height: 22px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Product dependencies</h1>
  <p class="lede">Pick a product to see which products and shared APIs it uses.</p>

  <p class="label" id="pick-label">Viewing from</p>
  <div class="chips" id="chips" role="group" aria-labelledby="pick-label"></div>

  <p class="summary" id="summary" aria-live="polite"></p>

  <h2>Products</h2>
  <div class="grid" id="products"></div>

  <h2>Shared APIs</h2>
  <div class="grid" id="apis"></div>

  <div class="legend">
    <span class="key" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-4 4 3 3m-5-1 2 2"/></svg></span>
    <span>Key = signs in through User Portal. Everything has it except GS Official Website and Training Center.</span>
  </div>
</main>

<script>
// [name, kind, isProduct, usedBy]
var D = [
  ["Calc", "Product", 1, ["BinGrid", "Wells"]],
  ["GeoRepository", "Product", 1, ["TC"]],
  ["BinGrid", "Product", 1, ["TC"]],
  ["Wells", "Product", 1, ["TC"]],
  ["GeoFileManager", "Shared API", 0, ["BinGrid", "Wells", "Calc", "GeoFlow"]],
  ["VectorData", "Shared API", 0, ["BinGrid", "Wells"]],
  ["ProjectLink", "Shared API", 0, ["BinGrid", "Wells"]],
  ["Composite", "Shared API", 0, ["BinGrid", "Wells", "GeoRepo"]],
  ["PositionData", "Shared API", 0, ["BinGrid"]],
  ["Billing", "Shared API", 0, ["GS", "UP"]],
  ["Sync", "Shared API", 0, ["GeoRepo"]],
  ["Release", "Shared API", 0, ["GeoRepo"]],
  ["Change Request", "Shared API", 0, ["GeoRepo"]]
];
// [id, label, signs in through User Portal]
var P = [
  ["BinGrid", "BinGrid", 1], ["Wells", "Wells", 1], ["GeoRepo", "GeoRepository", 1],
  ["Calc", "Calc", 1], ["GeoFlow", "GeoFlow", 1], ["TC", "Training Center", 0],
  ["GS", "GS Official", 0], ["UP", "User Portal", 1]
];
var LB = {}; P.forEach(function (p) { LB[p[0]] = p[1]; });
var KEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-4 4 3 3m-5-1 2 2"/></svg>';

function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

var chips = document.getElementById("chips");
P.forEach(function (p) {
  var b = el("button", "chip", (p[2] ? KEY : "") + esc(p[1]));
  b.type = "button"; b.dataset.k = p[0]; b.setAttribute("aria-pressed", "false");
  chips.appendChild(b);
});

var cards = D.map(function (d) {
  var c = el("div", "card" + (d[2] ? " product" : ""));
  c.innerHTML =
    '<div class="card-head"><span class="card-name">' + esc(d[0]) + "</span>" +
    (d[2] ? '<span class="key" title="Signs in through User Portal">' + KEY + "</span>" : "") + "</div>" +
    '<p class="kind">' + d[1] + "</p>" +
    '<div class="tags">' + d[3].map(function (u) {
      return '<span class="tag">' + (u === "TC" ? "Taught in Training Center" : esc(LB[u])) + "</span>";
    }).join("") + "</div>";
  document.getElementById(d[2] ? "products" : "apis").appendChild(c);
  return c;
});

function show(k) {
  chips.querySelectorAll(".chip").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.k === k)); });
  var n = 0;
  cards.forEach(function (c, i) {
    var on = D[i][3].indexOf(k) > -1;
    if (on) n++;
    c.classList.toggle("on", on);
    c.classList.toggle("dim", !on);
  });
  var p = P.filter(function (x) { return x[0] === k; })[0];
  var line = k === "TC" ? "Teaches users how to use " + n + " products." : LB[k] + " uses " + n + ".";
  var auth = k === "UP" ? "It is the login desk itself." : p[2] ? "Signs in through User Portal." : "Does not sign in through User Portal.";
  document.getElementById("summary").innerHTML = esc(line) + '<span class="auth">' + auth + "</span>";
}
chips.addEventListener("click", function (e) { var b = e.target.closest(".chip"); if (b) show(b.dataset.k); });
show("BinGrid");
</script>
</body>
</html>
