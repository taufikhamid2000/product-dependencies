<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product dependencies</title>
<meta name="description" content="Which products and shared APIs each product uses.">
<style>
:root {
  --bg: #f6f6f9;
  --surface: #ffffff;
  --text: #1c1b2e;
  --muted: #5d5b73;
  --line: #e2e1ec;
  --accent: #4b3fc9;
  --accent-ink: #ffffff;
  --accent-soft: #ecebfb;
  --prod: #0d7a5f;
  --prod-soft: #e1f4ee;
  --key: #b3441f;
  --key-soft: #fbece6;
  --radius: 14px;
  --wip: #8a5a00;
  --wip-soft: #fdf0cf;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121120;
    --surface: #1b1a2d;
    --text: #ececf6;
    --muted: #a3a1bd;
    --line: #2f2e47;
    --accent: #8f86ff;
    --accent-ink: #14122b;
    --accent-soft: #28254d;
    --prod: #4fd1a5;
    --prod-soft: #12302a;
    --key: #f2a07f;
    --key-soft: #3a211a;
    --wip: #f5c451;
    --wip-soft: #3a2f10;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 1040px; margin: 0 auto; padding: 14px 16px 20px; }
h1 { font-size: 1.15rem; line-height: 1.2; margin: 0 0 2px; letter-spacing: -0.01em; }
.lede { margin: 0 0 10px; color: var(--muted); font-size: 0.85rem; }
h2 {
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin: 12px 0 6px; font-weight: 650;
}
.label { display: none; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font: 600 0.8rem/1 inherit; font-family: inherit;
  padding: 7px 11px; min-height: 32px;
  border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); cursor: pointer;
  transition: background .15s, border-color .15s;
}
.chip:hover { border-color: var(--accent); }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip svg { width: 12px; height: 12px; flex: none; }

.summary {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 4px solid var(--accent); border-radius: var(--radius);
  padding: 8px 12px; margin: 0 0 4px; font-weight: 550; font-size: 0.9rem;
}
.summary .auth { margin-left: 8px; font-weight: 400; color: var(--muted); font-size: 0.85rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 7px 10px;
  transition: opacity .2s, border-color .2s, transform .2s;
}
.card.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card.dim { opacity: .38; }
.card.product.on { border-color: var(--prod); box-shadow: 0 0 0 1px var(--prod) inset; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-name { font-weight: 650; font-size: 0.9rem; }
.kind { display: none; }
.card.product .kind { color: var(--prod); }
.key {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 6px; background: var(--key-soft); color: var(--key);
}
.key svg { width: 12px; height: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag {
  font-size: 0.68rem; font-weight: 600; padding: 1px 7px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
}
.card.product .tag { background: var(--prod-soft); color: var(--prod); }

.badge {
  display: inline-block; margin-top: 4px; font-size: 0.68rem; font-weight: 650;
  padding: 1px 7px; border-radius: 999px; background: var(--wip-soft); color: var(--wip);
}
.badge[hidden] { display: none; }
.badge.na { background: var(--line); color: var(--muted); }
.card.na { border-style: dashed; opacity: .55; }
.card.na.on, .card.na.product.on { box-shadow: none; border-color: var(--line); }
.envrow { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.envrow label { font-size: 0.8rem; font-weight: 650; color: var(--muted); }
.envrow select {
  font: 600 0.85rem/1 inherit; font-family: inherit; min-height: 32px; padding: 6px 10px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
.envrow select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.editbtn { font: 600 0.8rem/1 inherit; font-family: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.editbtn:hover { color: var(--text); border-color: var(--accent); }
.login { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; }
.login input, .edit .bd { font: 0.85rem/1 inherit; font-family: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); min-width: 0; }
.login input { flex: 1 1 200px; }
.edit { margin-top: 6px; display: grid; gap: 6px; }
.edit label { font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.edit .bd { width: 100%; font-size: 0.78rem; padding: 5px 8px; }
.edit[hidden], .login[hidden] { display: none; }
.status { margin: 0 0 6px; font-size: 0.8rem; color: var(--muted); }
.status:empty { display: none; }
.status.bad { color: var(--key); }
.legend {
  display: flex; align-items: flex-start; gap: 10px;
  margin-top: 10px; padding: 7px 10px; border-radius: 10px;
  background: var(--key-soft); color: var(--text); font-size: 0.78rem; line-height: 1.35;
}
.legend .key { background: transparent; flex: none; width: 16px; height: 16px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main>
  <div class="top"><h1>Product dependencies</h1><button type="button" class="editbtn" id="editBtn" hidden>Edit</button></div>
  <p class="lede">Pick a product to see what it uses.</p>

  <form class="login" id="login" hidden><input type="email" id="email" required autocomplete="email" placeholder="Your email" aria-label="Email"><button type="submit" class="chip">Send sign-in link</button></form>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="envrow"><label for="env">Environment</label><select id="env"></select></div>
  <p class="label" id="pick-label">Viewing from</p>
  <div class="chips" id="chips" role="group" aria-labelledby="pick-label"></div>

  <p class="summary" id="summary" aria-live="polite"></p>

  <h2>Products</h2>
  <div class="grid" id="products"></div>

  <h2>Shared APIs</h2>
  <div class="grid" id="apis"></div>

  <div class="legend">
    <span class="key" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-4 4 3 3m-5-1 2 2"/></svg></span>
    <span>Key = signs in through User Portal. Everything has it except GS Official Website and BHOO.</span>
  </div>
</main>

<script>
// [name, kind, isProduct, usedBy]
var D = [
  ["Calc", "Product", 1, ["BinGrid", "Wells"]],
  ["GeoRepository", "Product", 1, []],
  ["BinGrid", "Product", 1, []],
  ["Wells", "Product", 1, []],
  ["GeoFileManager", "Shared API", 0, ["BinGrid", "Wells", "Calc", "GeoFlow"]],
  ["VectorData", "Shared API", 0, ["BinGrid", "Wells"]],
  ["ProjectLink", "Shared API", 0, ["BinGrid", "Wells"]],
  ["Composite", "Shared API", 0, ["BinGrid", "Wells", "GeoRepo"]],
  ["PositionData", "Shared API", 0, ["BinGrid"]],
  ["Billing", "Shared API", 0, ["GS", "UP"]],
  ["Sync", "Shared API", 0, ["GeoRepo"]],
  ["Release", "Shared API", 0, ["GeoRepo"]],
  ["Change Request", "Shared API", 0, ["GeoRepo"]],
  ["BHOO", "Shared API", 0, ["GeoRepo"]]
];
// [id, label, signs in through User Portal]
var P = [
  ["BinGrid", "BinGrid", 1], ["Wells", "Wells", 1], ["GeoRepo", "GeoRepository", 1],
  ["Calc", "Calc", 1], ["GeoFlow", "GeoFlow", 1],
  ["GS", "GS Official", 0], ["UP", "User Portal", 1]
];
var LB = {}; P.forEach(function (p) { LB[p[0]] = p[1]; });
var KEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3m-4 4 3 3m-5-1 2 2"/></svg>';

function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

var chips = document.getElementById("chips");
P.forEach(function (p) {
  var b = el("button", "chip", (p[2] ? KEY : "") + esc(p[1]));
  b.type = "button"; b.dataset.k = p[0]; b.setAttribute("aria-pressed", "false");
  chips.appendChild(b);
});

var cards = D.map(function (d) {
  var c = el("div", "card" + (d[2] ? " product" : "")); c.dataset.name = d[0];
  c.innerHTML =
    '<div class="card-head"><span class="card-name">' + esc(d[0]) + "</span>" +
    (d[0] !== "BHOO" ? '<span class="key" title="Signs in through User Portal">' + KEY + "</span>" : "") + "</div>" +
    '<p class="kind">' + d[1] + "</p>" +
    '<span class="badge" hidden></span>' +
    '<div class="edit" hidden><label><input type="checkbox" class="ck"> In this environment</label><input class="bd" type="text" maxlength="60" placeholder="Badge text (optional)" aria-label="Badge text"></div>' +
    '<div class="tags">' + d[3].map(function (u) {
      return '<span class="tag">' + esc(LB[u]) + "</span>";
    }).join("") + "</div>";
  document.getElementById(d[2] ? "products" : "apis").appendChild(c);
  return c;
});

var SB_URL = "https://hmkjszolqnpcsoatrgcu.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhta2pzem9scW5wY3NvYXRyZ2N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjc1MDU4MTgsImV4cCI6MjA0MzA4MTgxOH0.4qDEAKenGN78ro-es_aWrhMp3S_L1Ycm3Tn1Qo97-bI";
var OWNER = "taufikhamid2000@gmail.com";
var sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;

var envList = [], avail = {}, editing = false, signedIn = false, curKey = "BinGrid";
var envSel = document.getElementById("env"), statusEl = document.getElementById("status");

function get(path) {
  return fetch(SB_URL + "/rest/v1/" + path, { headers: { apikey: SB_KEY, Authorization: "Bearer " + SB_KEY } })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}
function say(msg, bad) { statusEl.textContent = msg || ""; statusEl.className = "status" + (bad ? " bad" : ""); }
function cell(envId, name) { return (avail[envId] && avail[envId][name]) || { available: true, badge: null }; }
function env() { return envList.filter(function (e) { return e.id === envSel.value; })[0]; }

function load() {
  return Promise.all([get("pd_environments?select=id,grp,sort&order=sort"), get("pd_availability?select=env,item,available,badge")])
    .then(function (res) {
      envList = res[0]; avail = {};
      res[1].forEach(function (a) { (avail[a.env] = avail[a.env] || {})[a.item] = { available: a.available, badge: a.badge }; });
      var keep = envSel.value; envSel.innerHTML = ""; var groups = {};
      envList.forEach(function (e) {
        if (!groups[e.grp]) { groups[e.grp] = el("optgroup"); groups[e.grp].label = e.grp; envSel.appendChild(groups[e.grp]); }
        var o = el("option", null, esc(e.id)); o.value = e.id; groups[e.grp].appendChild(o);
      });
      if (keep && avail[keep]) envSel.value = keep;
      say("");
      show(curKey);
    })
    .catch(function () { say("Could not load data. Try refreshing.", true); });
}

function save(envId, name, patch) {
  var row = Object.assign({ env: envId, item: name }, cell(envId, name), patch);
  (avail[envId] = avail[envId] || {})[name] = { available: row.available, badge: row.badge };
  show(curKey);
  say("Saving...");
  sb.from("pd_availability").upsert(row).then(function (r) {
    if (r.error) { say("Save failed: " + r.error.message, true); load(); } else say("Saved.");
  });
}
document.querySelector("main").addEventListener("change", function (e) {
  var c = e.target.closest(".card"); if (!c || !editing) return;
  var name = c.dataset.name, envId = envSel.value;
  if (e.target.classList.contains("ck")) save(envId, name, { available: e.target.checked });
  if (e.target.classList.contains("bd")) save(envId, name, { badge: e.target.value.trim() || null });
});

function show(k) {
  curKey = k;
  var ev = env(); if (!ev) return;
  chips.querySelectorAll(".chip").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.k === k)); });
  var n = 0;
  cards.forEach(function (c, i) {
    var name = D[i][0], a = cell(ev.id, name), na = !a.available, wip = a.badge;
    var on = D[i][3].indexOf(k) > -1 && !na;
    if (on) n++;
    c.classList.toggle("on", on);
    c.classList.toggle("dim", !on && !na);
    c.classList.toggle("na", na);
    var b = c.querySelector(".badge");
    b.hidden = editing || !(na || wip);
    b.classList.toggle("na", na);
    b.textContent = na ? "Not in this environment" : wip || "";
    var ed = c.querySelector(".edit");
    ed.hidden = !editing;
    ed.querySelector(".ck").checked = a.available;
    var bd = ed.querySelector(".bd");
    if (document.activeElement !== bd) bd.value = a.badge || "";
  });
  var p = P.filter(function (x) { return x[0] === k; })[0];
  var line = LB[k] + " uses " + n + " in " + ev.id + ".";
  var auth = k === "UP" ? "It is the login desk itself." : p[2] ? "Signs in through User Portal." : "Does not sign in through User Portal.";
  document.getElementById("summary").innerHTML = esc(line) + '<span class="auth">' + auth + "</span>";
}
chips.addEventListener("click", function (e) { var b = e.target.closest(".chip"); if (b) show(b.dataset.k); });
envSel.addEventListener("change", function () { show(curKey); });

// --- owner sign-in and edit mode ---
var editBtn = document.getElementById("editBtn"), loginBox = document.getElementById("login");
function refreshEditUi() {
  editBtn.textContent = editing ? "Done editing" : "Edit";
  editBtn.hidden = !sb;
  document.body.classList.toggle("editing", editing);
  show(curKey);
}
editBtn.addEventListener("click", function () {
  if (editing) { editing = false; loginBox.hidden = true; return refreshEditUi(); }
  if (signedIn) { editing = true; return refreshEditUi(); }
  loginBox.hidden = !loginBox.hidden;
});
loginBox.addEventListener("submit", function (e) {
  e.preventDefault();
  var email = document.getElementById("email").value.trim();
  sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: false, emailRedirectTo: location.origin + location.pathname } })
    .then(function (r) { say(r.error ? "Could not send link: " + r.error.message : "Check your email for the sign-in link.", !!r.error); });
});
if (sb) {
  sb.auth.onAuthStateChange(function (_ev, session) {
    signedIn = !!(session && session.user && session.user.email === OWNER);
    if (signedIn && !editing) { editing = true; loginBox.hidden = true; say(""); }
    if (!signedIn) editing = false;
    refreshEditUi();
  });
}
refreshEditUi();
load();
</script>
</body>
</html>
